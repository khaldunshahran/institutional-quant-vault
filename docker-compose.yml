# Institutional Quant Vault — paper trading only. No live execution exists
# in this codebase (the execution adapter refuses live mode unconditionally).
version: "3.9"

services:
  trader:
    image: python:3.12-slim
    working_dir: /workspace
    command: ["python", "scripts/autonomous_multi_asset_trader.py"]
    volumes:
      - .:/workspace
    env_file:
      - path: .env
        required: false # optional: TELEGRAM_* credentials for alerts
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  dashboard:
    image: python:3.12-slim
    working_dir: /workspace
    command: ["python", "ui/server.py"]
    volumes:
      - .:/workspace
    ports:
      - "127.0.0.1:5000:5000" # loopback only: the dashboard has no auth
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
