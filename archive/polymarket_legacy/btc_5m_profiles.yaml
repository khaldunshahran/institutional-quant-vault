version: 1
name: btc_5m_impulse_momentum_profiles
market: polymarket_btc_updown_5m
strategy_reference:
  style: momentum_follow_through_into_close
  entry_window_seconds_left_target: 120
  entry_window_seconds_left_tolerance: 30
  btc_move_usd_min: 70
  btc_move_usd_max_reference: 100
  skew_bias_note: Prefer direction supported by market skew when momentum is already
    established.
  sizing_note: Typical discretionary sizing can be up to ~50% of allocated trading
    balance; tune risk per user preference.
  optional_hedge_note: When skew is extreme (for example >=95/5), allow a small opposite
    hedge to reduce last-second reversal risk.
shared_rules:
  market_validation:
    require_active: true
    require_not_closed: true
    require_end_in_future_sec_min: 5
    candidate_slots:
    - prev
    - current
    - next
    - next2
    choose: closest_valid
  heartbeat:
    enabled: true
    max_stale_sec: 15
    check_interval_sec: 5
    fail_action: skip
  execution_safety:
    skip_if_quote_stale_sec_gt: 8
    skip_if_dns_or_api_errors_consecutive: 3
    skip_if_spread_gt: 0.03
    skip_if_top_ask_notional_usd_lt: 30
  session_timing:
    monitor_continuous: true
    min_entry_seconds_left: 60
    exit_before_sec: 20
profiles:
  jev_ai_brain:
    name: "Jev AI Decision Brain (TypeSafe)"
    description: "Autonomous System One AI brain evaluating orderbook skew, spot momentum, and reversal risk with confidence-gated execution."
    ai_engine:
      enabled: true
      model: "jev-latest"
      min_confidence: 0.65
      min_conviction: 3.0
      max_reversal_risk: 0.35
    signal:
      trigger_source: clob_best_ask
      direction_rule: jev_system_one
      threshold_price: 0.60
      max_entry_price: 0.80
      min_btc_impulse: 60.0
    sizing:
      stake_mode: fixed_or_cap
      stake_usd: 5.0
      risk_per_trade_pct_equity: 10
      max_notional_usd: 10
      daily_max_loss_pct: 12
      max_trades_per_day: 15
    take_profit:
      enabled: true
      take_profit_pct: 0.25
    stop_loss:
      enabled: true
      stop_loss_pct_from_entry: 0.25
    trailing_stop:
      enabled: true
      trailing_stop_pct: 0.10
    timing:
      exit_before_sec: 20
      min_entry_seconds_left: 45
      max_entry_seconds_left: 180

  momentum_value:
    name: "Momentum Value (Balanced R:R)"
    description: "Momentum Value: Enters early breakout with strict price ceiling ($0.78) and +22% take-profit, preventing late-entry inverted losses."
    signal:
      trigger_source: clob_best_ask
      direction_rule: follow_stronger_side_over_threshold
      threshold_price: 0.65
      max_entry_price: 0.78
      min_btc_impulse: 70.0
    sizing:
      stake_mode: fixed_or_cap
      stake_usd: 5.0
      risk_per_trade_pct_equity: 8
      max_notional_usd: 8
      daily_max_loss_pct: 10
      max_trades_per_day: 12
    take_profit:
      enabled: true
      take_profit_pct: 0.22
    stop_loss:
      enabled: true
      stop_loss_pct_from_entry: 0.25
    timing:
      exit_before_sec: 20
      min_entry_seconds_left: 60
      max_entry_seconds_left: 150

  quick_scalp:
    name: "Quick Scalp & Secure"
    description: "Quick Scalp: High-frequency scalping with fast +12% take-profit, trailing stop to break-even, and safe early exit 60s before expiry."
    signal:
      trigger_source: clob_best_ask
      direction_rule: follow_stronger_side_over_threshold
      threshold_price: 0.68
      max_entry_price: 0.76
      min_btc_impulse: 65.0
    sizing:
      stake_mode: fixed_or_cap
      stake_usd: 5.0
      risk_per_trade_pct_equity: 8
      max_notional_usd: 8
      daily_max_loss_pct: 10
      max_trades_per_day: 18
    take_profit:
      enabled: true
      take_profit_pct: 0.12
    trailing_stop:
      enabled: true
      trailing_stop_pct: 0.08
    stop_loss:
      enabled: true
      stop_loss_pct_from_entry: 0.20
    timing:
      exit_before_sec: 60
      min_entry_seconds_left: 90
      max_entry_seconds_left: 160

  mean_reversion:
    name: "Underdog Mean-Reversion"
    description: "Mean Reversion: Fades exhausted spikes by buying cheap underdog tokens ($0.15-$0.25) when favorite spikes >$0.85, yielding 3:1 to 5:1 payoff potential."
    signal:
      trigger_source: clob_best_ask
      direction_rule: fade_exhaustion_buy_underdog
      threshold_price: 0.15
      max_entry_price: 0.25
      trigger_opposite_ask_gte: 0.85
      min_btc_impulse: 40.0
    sizing:
      stake_mode: fixed_or_cap
      stake_usd: 5.0
      risk_per_trade_pct_equity: 8
      max_notional_usd: 8
      daily_max_loss_pct: 10
      max_trades_per_day: 10
    take_profit:
      enabled: true
      take_profit_pct: 0.80
    stop_loss:
      enabled: true
      stop_loss_pct_from_entry: 0.40
    timing:
      exit_before_sec: 20
      min_entry_seconds_left: 45
      max_entry_seconds_left: 140

  skew_hedge:
    name: "Skew-Protected Asymmetric Hedge"
    description: "Skew Hedge: Core momentum follow-through protected by an automatic 5% opposite tail hedge on extreme skew (>=93%) to prevent black-swan wipeouts."
    signal:
      trigger_source: clob_best_ask
      direction_rule: follow_stronger_side_over_threshold
      threshold_price: 0.70
      max_entry_price: 0.80
      min_btc_impulse: 70.0
    sizing:
      stake_mode: fixed_or_cap
      stake_usd: 5.0
      risk_per_trade_pct_equity: 8
      max_notional_usd: 8
      daily_max_loss_pct: 10
      max_trades_per_day: 12
    hedge:
      enabled: true
      trigger_side_price_gte: 0.93
      hedge_share_of_main_pct: 5
      hedge_notional_usd_min: 0.50
      hedge_notional_usd_max: 1.50
    take_profit:
      enabled: true
      take_profit_pct: 0.25
    stop_loss:
      enabled: true
      stop_loss_pct_from_entry: 0.25
    timing:
      exit_before_sec: 20
      min_entry_seconds_left: 60
      max_entry_seconds_left: 150

  macro_trend_sniper:
    name: "Macro Trend Sniper"
    description: "Trend Sniper: Selective high-conviction breakout requiring larger BTC impulse (±$85) and strict price ceiling, cutting out noisy low-volatility chop."
    signal:
      trigger_source: clob_best_ask
      direction_rule: follow_stronger_side_over_threshold
      threshold_price: 0.70
      max_entry_price: 0.79
      min_btc_impulse: 85.0
    sizing:
      stake_mode: fixed_or_cap
      stake_usd: 5.0
      risk_per_trade_pct_equity: 8
      max_notional_usd: 8
      daily_max_loss_pct: 10
      max_trades_per_day: 8
    take_profit:
      enabled: true
      take_profit_pct: 0.25
    stop_loss:
      enabled: true
      stop_loss_pct_from_entry: 0.22
    timing:
      exit_before_sec: 20
      min_entry_seconds_left: 60
      max_entry_seconds_left: 150

  conservative:
    name: "Conservative (Legacy)"
    description: "Conservative: Stricter impulse filters and capped frequency."
    signal:
      trigger_source: clob_best_ask
      direction_rule: follow_stronger_side_over_threshold
      threshold_price: 0.70
      max_entry_price: 0.82
      min_btc_impulse: 70.0
    sizing:
      stake_mode: fixed_or_cap
      stake_usd: 5.0
      risk_per_trade_pct_equity: 8
      max_notional_usd: 8
      daily_max_loss_pct: 10
      max_trades_per_day: 12
    take_profit:
      enabled: true
      take_profit_pct: 0.25
    stop_loss:
      enabled: true
      stop_loss_pct_from_entry: 0.25
    timing:
      exit_before_sec: 20
      min_entry_seconds_left: 60
      max_entry_seconds_left: 150

  aggressive:
    name: "Aggressive (Legacy)"
    description: "Aggressive: Higher frequency, lower trigger threshold (0.37) and wider daily trade cap."
    signal:
      trigger_source: clob_best_ask
      direction_rule: follow_stronger_side_over_threshold
      threshold_price: 0.37
      max_entry_price: 0.85
      min_btc_impulse: 50.0
    sizing:
      stake_mode: fixed_or_cap
      stake_usd: 5.0
      risk_per_trade_pct_equity: 15
      max_notional_usd: 15
      daily_max_loss_pct: 15
      max_trades_per_day: 20
    take_profit:
      enabled: false
      take_profit_pct: 0.35
    stop_loss:
      enabled: true
      stop_loss_pct_from_entry: 0.25
    timing:
      exit_before_sec: 20
      min_entry_seconds_left: 60
      max_entry_seconds_left: 180
runner_mapping:
  script: skills/btc-5m-live/scripts/test_btc_5m_session_exit_sl.py
  direct_flags_now_supported:
  - --threshold
  - --stake-usd
  - --stop-loss-pct
  - --exit-before-sec
  - --min-entry-seconds-left
  - --entry-timeout-min
  - --poll-sec
  - --execute
  example_conservative_now: .venv/bin/python scripts/test_btc_5m_session_exit_sl.py
    --threshold 0.70 --stake-usd 4 --stop-loss-pct 0.25 --exit-before-sec 20 --min-entry-seconds-left
    60 --entry-timeout-min 60 --poll-sec 5 --execute
  example_aggressive_now: .venv/bin/python scripts/test_btc_5m_session_exit_sl.py
    --threshold 0.70 --stake-usd 6 --stop-loss-pct 0.30 --exit-before-sec 20 --min-entry-seconds-left
    60 --entry-timeout-min 60 --poll-sec 5 --execute
notes:
- Current 5m runner uses threshold/side-strength logic; impulse filter integration
  can be extended at strategy layer.
- 'Entry behavior: continuous CLOB ask monitoring; if UP/DOWN >= threshold, enter
  on stronger side.'
